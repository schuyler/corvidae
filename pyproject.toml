[project]
name = "corvidae"
version = "0.0.1"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.9",
    "aiosqlite>=0.19",
    "apluggy @ git+https://github.com/schuyler/apluggy.git@main",
    "click>=8.0",
    "ddgs>=9.0",
    "mcp>=2.0",
    "pydle>=0.9",
    "pydantic>=2.13.3",
    "pyyaml>=6.0.3",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "jinja2>=3.1",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
acp = [
    "agent-client-protocol>=0.12.1,<0.13",
]
# The Discord transport's SDK (R10); the transport itself is in the kernel.
discord = [
    "discord-py>=2.4",
]
cross-channel-send = [
    "cross-channel-send",
]
# Memory, appraisal, critique, funnel and outcome log
# (packages/corvidae-cognition, docs/cognition.md). Includes the `vec`
# sub-extra, so the documented install keeps vector memory (#130). For the
# FTS5-only path, install cognition without its `vec` extra:
#   uv pip install -e packages/corvidae-cognition   # no [vec]
cognition = [
    "corvidae-cognition[vec]",
]

[project.scripts]
corvidae = "corvidae.main:corvidae"

[project.entry-points."corvidae.commands"]
cli = "corvidae.channels.cli:cli_command"
serve = "corvidae.commands.serve:serve_command"
scaffold = "corvidae.scaffold:scaffold_command"
redact = "corvidae.commands.redact:redact_command"
acp = "corvidae.channels.acp:acp_command"

[project.entry-points.corvidae]
persistence = "corvidae.persistence:PersistencePlugin"
jsonl_log = "corvidae.jsonl_log:JsonlLogPlugin"
core_tools = "corvidae.tools:CoreToolsPlugin"
cli = "corvidae.channels.cli:CLIPlugin"
irc = "corvidae.channels.irc:IRCPlugin"
signal = "corvidae.channels.signal:SignalPlugin"
discord = "corvidae.channels.discord:DiscordPlugin"
web = "corvidae.channels.web:WebPlugin"
acp = "corvidae.channels.acp:AcpPlugin"
task = "corvidae.task:TaskPlugin"
subagent = "corvidae.tools.subagent:SubagentPlugin"
mcp = "corvidae.mcp_client:McpClientPlugin"
llm = "corvidae.llm_plugin:LLMPlugin"
compaction = "corvidae.compaction:CompactionPlugin"
thinking = "corvidae.thinking:ThinkingPlugin"
runtime_settings = "corvidae.tools.settings:RuntimeSettingsPlugin"
tools = "corvidae.tool_collection:ToolCollectionPlugin"
metrics = "corvidae.metrics:MetricsPlugin"
usage_log = "corvidae.metrics:UsageLogPlugin"
metrics_jsonl = "corvidae.metrics:MetricsJsonlPlugin"
scheduler = "corvidae.scheduler:SchedulerPlugin"
agent = "corvidae.agent:Agent"
config_watcher = "corvidae.config_watcher:ConfigWatcherPlugin"

[tool.setuptools.packages.find]
include = ["corvidae*"]

# The web transport's browser UI ships inside the package.
[tool.setuptools.package-data]
"corvidae.channels" = ["web_static/*", "web_static/vendor/*", "registers/*.md"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17",
    "basedpyright>=1.28",
]

# Lint and type checks are ADVISORY until the tree is clean (#111, #455).
# CI runs them with continue-on-error, so the output is visible but does not
# fail the run. Flipping them to hard failures is #455's job.
#
# The rule set starts from ruff's defaults rather than "everything": E4/E7/E9
# (real errors) and F (pyflakes -- unused imports, undefined names), plus the
# isort rules. Widening it is #455's call.
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
# The project imports its own packages absolutely (`from corvidae.channel ...`),
# and `tests` is on pythonpath, so nothing here is first-party by convention.
known-first-party = ["corvidae"]

[tool.basedpyright]
include = ["corvidae", "packages"]
# Advisory only (#455): report everything, fail on nothing yet.
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["tests", "."]
markers = ["eval: live LLM evaluation tests (deselected by default, run with --run-eval)"]
filterwarnings = [
    "ignore::DeprecationWarning:_pytest",
]
timeout = 15
timeout_method = "thread"

# The cognition plugins are a workspace member in this repository.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
corvidae-cognition = { workspace = true }
cross-channel-send = { workspace = true }
