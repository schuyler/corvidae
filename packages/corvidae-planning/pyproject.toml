[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "corvidae-planning"
version = "0.0.1"
description = "Planning critique lens: flags turns that warrant a goal action (create/update/retire)"
requires-python = ">=3.13"
dependencies = ["corvidae", "corvidae-cognition"]

[project.entry-points.corvidae]
planning = "corvidae_planning:PlanningLensPlugin"

[tool.uv.sources]
corvidae = { workspace = true }
corvidae-cognition = { workspace = true }

# Explicit, so a later docs/ directory here can't break the build.
[tool.setuptools.packages.find]
include = ["corvidae_planning*"]
