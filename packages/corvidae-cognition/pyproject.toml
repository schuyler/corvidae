[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "corvidae-cognition"
version = "0.0.1"
description = "Cognition plugins for corvidae: memory, appraisal, critique, funnel, outcome log"
requires-python = ">=3.13"
dependencies = ["corvidae"]

# sqlite-vec is a compiled extension, and only memory and retention use it.
# Without it, memory degrades to FTS5 with one startup warning (PRD §3.7
# Memory 5, #130). The root `cognition` extra pulls this sub-extra in, so the
# documented install keeps vector memory; `cognition-fts` leaves it out.
[project.optional-dependencies]
vec = ["sqlite-vec>=0.1.9"]

[project.entry-points."corvidae.redact"]
exchange_log = "corvidae_cognition.outcome_log:redact_exchange_log"
retrieval_candidate = "corvidae_cognition.memory:redact_retrieval_candidates"

[project.entry-points."corvidae.commands"]
goals = "corvidae_cognition.goals:goals_command"

[project.entry-points.corvidae]
memory = "corvidae_cognition.memory:MemoryPlugin"
memory_tools = "corvidae_cognition.memory_tools:MemoryToolsPlugin"
funnel = "corvidae_cognition.funnel:FunnelPlugin"
outcome_log = "corvidae_cognition.outcome_log:OutcomeLogPlugin"
appraisal = "corvidae_cognition.appraisal:AppraisalPlugin"
critique = "corvidae_cognition.critique:CritiquePlugin"
gates = "corvidae_cognition.gates:GatePlugin"
silence = "corvidae_cognition.silence:SilencePlugin"
heartbeat = "corvidae_cognition.heartbeat:HeartbeatPlugin"
goals = "corvidae_cognition.goals:GoalsPlugin"
skills = "corvidae_cognition.skills:SkillsPlugin"

[tool.uv.sources]
corvidae = { workspace = true }

# Explicit, so a later tests/ or docs/ directory here can't break the build.
[tool.setuptools.packages.find]
include = ["corvidae_cognition*"]
