[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "corvidae-whatsapp"
version = "0.1.0"
description = "WhatsApp transport for corvidae, over a Baileys sidecar's JSON-RPC socket"
requires-python = ">=3.13"
dependencies = [
    "corvidae",
]

[tool.uv.sources]
corvidae = { workspace = true }

[project.entry-points.corvidae]
whatsapp = "corvidae_whatsapp:WhatsAppPlugin"

# sidecar/ is the Node process this transport talks to: a sibling of the Python
# package inside the project directory. setuptools' flat-layout discovery sees a
# second top-level directory there and refuses to build ("Multiple top-level
# packages discovered"), so the Python package is named explicitly (#1265).
[tool.setuptools]
packages = ["corvidae_whatsapp"]
