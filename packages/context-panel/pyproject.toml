[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "context-panel"
version = "0.0.1"
description = "Context panel for corvidae's web console: a live, read-only view of any loaded channel's context window"
requires-python = ">=3.13"
dependencies = ["corvidae"]

[project.entry-points.corvidae]
context_panel = "context_panel:ContextPanelPlugin"

[tool.uv.sources]
corvidae = { workspace = true }

# Explicit, so a later docs/ directory here can't break the build.
[tool.setuptools.packages.find]
include = ["context_panel*"]

# A non-editable install ships the panel's assets.
[tool.setuptools.package-data]
context_panel = ["static/*"]
