[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "corvidae-restart"
version = "0.0.1"
description = "Restart plugin for corvidae: restart tool with loop guard, pre-flight, and post-restart notification"
requires-python = ">=3.13"
dependencies = ["corvidae"]

[tool.uv.sources]
corvidae = { workspace = true }

[project.entry-points.corvidae]
restart = "corvidae_restart:RestartPlugin"
