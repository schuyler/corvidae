[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "goals-notify"
version = "0.0.1"
description = "Goals notification plugin for corvidae: goal state changes to the goal's origin channel"
requires-python = ">=3.13"
dependencies = ["corvidae", "cross-channel-send"]

[project.entry-points.corvidae]
goals_notify = "goals_notify:GoalsNotifyPlugin"

[tool.uv.sources]
corvidae = { workspace = true }
cross-channel-send = { workspace = true }

# Explicit, so a later docs/ directory here can't break the build.
[tool.setuptools.packages.find]
include = ["goals_notify*"]
