[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "corvidae-timepiece"
version = "0.1.0"
description = "Timepiece plugin for corvidae: ambient wall-clock stamps"
requires-python = ">=3.13"
dependencies = [
    "corvidae",
    "tzdata; platform_system == 'Windows'",
]

[tool.uv.sources]
corvidae = { workspace = true }

[project.entry-points.corvidae]
timepiece = "corvidae_timepiece:TimepiecePlugin"
