[project]
name = "timepiece"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "corvidae",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.entry-points.corvidae]
timepiece = "timepiece:TimepiecePlugin"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
