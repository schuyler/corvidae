[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "github-webhook"
version = "0.0.1"
description = "GitHub webhook plugin for corvidae: terminal CI, PR and push outcomes"
requires-python = ">=3.13"
dependencies = ["corvidae"]

[project.entry-points.corvidae]
github_webhook = "github_webhook:GithubWebhookPlugin"

[tool.uv.sources]
corvidae = { workspace = true }

# Explicit, so a later docs/ directory here can't break the build.
[tool.setuptools.packages.find]
include = ["github_webhook*"]
