[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "outbound-cap"
version = "0.0.1"
description = "Message cap plugin for corvidae: bounds agent messages per channel between human messages"
requires-python = ">=3.13"
dependencies = ["corvidae"]

[project.entry-points.corvidae]
outbound_cap = "outbound_cap:OutboundCapPlugin"

[tool.uv.sources]
corvidae = { workspace = true }

# Explicit, so a later docs/ directory here can't break the build.
[tool.setuptools.packages.find]
include = ["outbound_cap*"]
