# Runs the pytest suite on every push to main and every pull request.
# The harness (harness/, needs llama-server + ngircd) and the live-LLM eval
# tests (--run-eval) need real services and stay manual.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The kernel alone: no cognition extra, no Discord SDK. This job is the
  # acceptance test for "corvidae installs and works without the extras"
  # (plans/kernel-split.md, R1 and R10).
  kernel:
    runs-on: self-hosted
    # Backstop above pytest's own per-test timeout (15s, pyproject.toml).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      # The dev extra (pytest, pytest-asyncio) and the dev dependency group
      # (pytest-timeout), which the pytest config needs; see CLAUDE.md. The acp
      # extra is needed because the ACP transport tests import the SDK.
      # --locked fails the run if uv.lock is out of date with pyproject.toml.
      - name: Install dependencies (kernel)
        run: uv sync --locked --extra dev --extra acp

      # Prove the optional packages really are absent, so a dependency that
      # pulls one back in fails here rather than passing unnoticed.
      - name: Check the extras are not installed
        run: |
          uv run --no-sync python - <<'PY'
          import importlib.util
          present = [m for m in ("sqlite_vec", "discord", "corvidae_cognition",
                                 "cross_channel_send", "corvidae_restart",
                                 "webhook_notify", "context_panel",
                                 "corvidae_timepiece", "corvidae_inotify",
                                 "emoji")
                     if importlib.util.find_spec(m) is not None]
          assert not present, f"kernel install has optional packages: {present}"
          import corvidae.channels.discord  # must import without its SDK
          import corvidae.channels.signal  # must import without its table
          print("kernel install: no optional packages")
          PY

      - name: Run kernel tests
        run: uv run --no-sync pytest -q --ignore=tests/cognition --ignore=tests/test_cross_channel_send --ignore=tests/test_webhook_notify --ignore=tests/test_context_panel --ignore=tests/corvidae_restart --ignore=tests/test_timepiece --ignore=tests/test_inotify --ignore=packages/corvidae-vision/tests --ignore=packages/rss-reader/tests

      # Advisory until the tree is clean (#111, #455): the output is in the
      # log, but a finding does not fail the run. Drop continue-on-error in
      # #455 once main reports nothing.
      - name: Lint (advisory, #111)
        continue-on-error: true
        run: uv run --no-sync ruff check .

      - name: Check formatting (advisory, #111)
        continue-on-error: true
        run: uv run --no-sync ruff format --check .

      - name: Type-check (advisory, #111)
        continue-on-error: true
        run: uv run --no-sync basedpyright

  # Everything: the kernel plus the cognition and discord extras.
  full:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies (all extras)
        run: uv sync --locked --extra dev --extra acp --extra discord --extra cognition --extra cross-channel-send --extra webhook-notify --extra context-panel --extra restart --extra timepiece --extra inotify --extra rss --extra signal

      # About 26 test sites skip when sqlite-vec can't load, and the Discord
      # tests skip without the SDK, as do the Signal tests without `emoji`, which would turn them into silent skips
      # on a green run. Fail here instead.
      - name: Check sqlite-vec, discord and emoji load
        run: |
          uv run --no-sync python - <<'PY'
          import sqlite3
          import sqlite_vec
          import discord
          import emoji

          conn = sqlite3.connect(":memory:")
          conn.enable_load_extension(True)
          sqlite_vec.load(conn)
          print("sqlite", sqlite3.sqlite_version,
                "/ sqlite-vec", conn.execute("SELECT vec_version()").fetchone()[0],
                "/ discord.py", discord.__version__)
          PY

      - name: Run tests
        run: uv run --no-sync pytest -q --ignore=packages/corvidae-vision/tests

  # Cognition without its sqlite-vec extra (#130): the FTS5-only degradation
  # path PRD §3.7 (Memory 5) requires. Without this job the vector tests skip
  # silently in every other configuration.
  cognition-fts:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      # Cognition is installed WITHOUT its `vec` sub-extra. A workspace sync
      # does not pull the member in on its own, so this names it explicitly.
      - name: Install dependencies (no sqlite-vec)
        run: |
          uv sync --locked --extra dev --extra acp
          uv pip install --no-deps -e packages/corvidae-cognition

      - name: Check sqlite-vec really is absent
        run: |
          uv run --no-sync python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("sqlite_vec") is None, \
              "this job must run without sqlite-vec; the FTS5 path is untested otherwise"
          assert importlib.util.find_spec("corvidae_cognition") is not None, \
              "cognition did not install"
          print("cognition installed, sqlite-vec absent")
          PY

      - name: Run cognition tests on the FTS5 path
        run: uv run --no-sync pytest -q tests/cognition

  # The browser smoke test for the web console's DOMPurify options (#90, #254).  # tests/test_web_render_smoke.py skips itself without Playwright, so neither
  # job above runs it; this one installs Playwright and Chromium and fails on a
  # skip. Playwright is pinned and supplied with `--with`, so it stays out of
  # pyproject.toml and uv.lock.
  web-smoke:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      # The kernel install plus the context panel, whose smoke test needs it.
      # The test reuses the web plugin harness.
      - name: Install dependencies (kernel and context panel)
        run: uv sync --locked --extra dev --extra acp --extra context-panel

      # Chromium plus the system libraries it needs on the runner.
      - name: Install Playwright Chromium
        run: uv run --no-sync --with playwright==1.64.0 playwright install chromium

      # -rs lists skips; a skip means the guard did not run, so fail on one.
      - name: Run web render smoke tests
        # shell: bash makes GitHub run with -eo pipefail, so a failing or
        # erroring pytest fails the step instead of being masked by tee.
        shell: bash
        run: |
          uv run --no-sync --with playwright==1.64.0 pytest -q -rs tests/test_web_render_smoke.py tests/test_context_panel/test_render_smoke.py | tee smoke.log
          if grep -q SKIPPED smoke.log; then
            echo "a web render smoke test was skipped; Playwright or its browser is unusable" >&2
            exit 1
          fi
