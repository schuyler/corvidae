# Runs the pytest suite on every push to main and every pull request.
# The harness (harness/, needs llama-server + ngircd) and the live-LLM eval
# tests (--run-eval) need real services and stay manual.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    # Backstop above pytest's own per-test timeout (15s, pyproject.toml).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      # The dev extra (pytest, pytest-asyncio) and the dev dependency group
      # (pytest-timeout), which the pytest config needs; see CLAUDE.md.
      - name: Install dependencies
        run: uv sync --extra dev

      # About 26 test sites skip when sqlite-vec can't load, which would turn
      # the vector-retrieval tests into silent skips on a green run. Fail
      # here instead.
      - name: Check sqlite-vec loads
        run: |
          uv run python - <<'PY'
          import sqlite3
          import sqlite_vec

          conn = sqlite3.connect(":memory:")
          conn.enable_load_extension(True)
          sqlite_vec.load(conn)
          print("sqlite", sqlite3.sqlite_version,
                "/ sqlite-vec", conn.execute("SELECT vec_version()").fetchone()[0])
          PY

      - name: Run tests
        run: uv run pytest -q
